name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: git -C /opt/family-planner pull origin main

      - name: Install dependencies
        run: /opt/family-planner/venv/bin/pip install -r /opt/family-planner/requirements.txt

      - name: Restart service
        run: sudo systemctl restart family-dashboard

      - name: Clean up runner artifacts
        if: always()
        run: |
          # Old versioned runner directories left after auto-updates.
          # bin/externals are symlinks to the active bin.<ver>/externals.<ver> dirs -
          # exclude those from deletion or we remove the version currently in use.
          cd /opt/family-planner/actions-runner
          active_bin=$(basename "$(readlink -f bin)")
          active_externals=$(basename "$(readlink -f externals)")
          find . -maxdepth 1 -name 'bin.*' -type d ! -name "$active_bin" -exec rm -rf {} + 2>/dev/null || true
          find . -maxdepth 1 -name 'externals.*' -type d ! -name "$active_externals" -exec rm -rf {} + 2>/dev/null || true
          # Installation tarballs
          find /opt/family-planner/actions-runner -maxdepth 1 -name '*.tar.gz' -delete 2>/dev/null || true
          # Build workspace
          rm -rf /opt/family-planner/actions-runner/_work/* 2>/dev/null || true
          # Runner diagnostic logs older than 7 days
          find /opt/family-planner/actions-runner/_diag -name '*.log' -mtime +7 -delete 2>/dev/null || true
